<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f6f2">
  <meta name="robots" content="noindex, nofollow">
  <script>try{if(localStorage.getItem("space-theme")==="dark")document.documentElement.classList.add("dark")}catch(error){}</script>
  <title>دخول المالك — مساحة</title>
  <meta name="description" content="دخول خاص بمالك مساحة لإدارة محتوى الموقع.">
  <meta property="og:title" content="دخول المالك — مساحة">
  <meta property="og:description" content="دخول خاص بمالك مساحة لإدارة محتوى الموقع.">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="ar_AR">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns=%27http://www.w3.org/2000/svg%27%20viewBox=%270%200%2064%2064%27%3E%3Crect%20width=%2764%27%20height=%2764%27%20rx=%2716%27%20fill=%27%23287452%27/%3E%3Ctext%20x=%2732%27%20y=%2745%27%20text-anchor=%27middle%27%20font-family=%27Arial%2Csans-serif%27%20font-size=%2740%27%20font-weight=%27700%27%20fill=%27white%27%3E%D9%85%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="site.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
  <script src="supabase-config.js" defer></script>
  <script src="supabase-client.js" defer></script>
  <script src="i18n.js" defer></script>
  <script src="site.js" defer></script>
  <script src="owner-login.js" defer></script>
</head>
<body>
  <div id="site-header"></div>
  <main class="container page-main">
    <header class="page-heading">
      <span class="overline">إدارة مساحة</span>
      <h1>دخول المالك</h1>
      <p>تسجيل الدخول متاح لحساب المالك فقط.</p>
    </header>
    <form class="content-panel owner-login-form" id="ownerLoginForm" novalidate>
      <div class="form-field">
        <label for="ownerEmail">البريد الإلكتروني</label>
        <input id="ownerEmail" name="email" type="email" autocomplete="username" required>
      </div>
      <div class="form-field">
        <label for="ownerPassword">كلمة المرور</label>
        <input id="ownerPassword" name="password" type="password" autocomplete="current-password" required>
      </div>
      <p class="notice form-status" id="ownerLoginStatus" role="status" aria-live="polite" hidden></p>
      <button class="button primary" type="submit">دخول</button>
      <a class="inline-link" href="index.html">العودة إلى الموقع</a>
    </form>
  </main>
  <div id="site-footer"></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
