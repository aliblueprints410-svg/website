<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f6f2"><script>try{if(localStorage.getItem("space-theme")==="dark")document.documentElement.classList.add("dark")}catch(error){}</script>
  <title>المنشور — مساحة</title>
  <meta name="description" content="اقرأ منشوراً من مساحة وتعرّف على الوسوم والتطبيق المرتبط به.">
  <meta property="og:title" content="المنشور — مساحة">
  <meta property="og:description" content="اقرأ منشوراً من مساحة وتعرّف على الوسوم والتطبيق المرتبط به.">
  <meta property="og:type" content="article">
  <meta property="og:locale" content="ar_AR">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="site.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script><script src="supabase-config.js" defer></script><script src="supabase-client.js" defer></script><script src="i18n.js" defer></script><script src="data.js" defer></script>
  <script src="site.js" defer></script>
  <script src="content-pages.js" defer></script>
</head>
<body>
  <div id="site-header"></div>
  <main class="container page-main">
    <div class="breadcrumbs"><a href="index.html" data-i18n="nav.home">الرئيسية</a><span>／</span><a href="posts.html" data-i18n="nav.posts">المنشورات</a><span>／</span><span id="postCrumb">المنشور</span></div>
    <p class="empty-state" id="postLoading" role="status" data-i18n="posts.loading">جارٍ تحميل المنشور...</p>
    <p class="empty-state" id="postNotFound" hidden data-i18n="posts.empty">لم نجد هذا المنشور. <a href="posts.html">العودة إلى المنشورات</a></p>
    <p class="empty-state" id="postError" hidden data-i18n="posts.error">تعذّر تحميل المنشور. حاول مرة أخرى.</p>
    <article class="content-panel post-detail" id="postDetail" hidden>
      <span class="overline" id="postKind"></span>
      <span class="demo-badge" id="postDemoBadge" hidden>بيانات تجريبية</span>
      <h1 id="postTitle"></h1>
      <p class="post-detail-byline"><span id="postAuthor"></span><span aria-hidden="true"> · </span><time id="postDate"></time></p>
      <div class="post-tags" id="postTags" aria-label="وسوم المنشور" hidden></div>
      <p class="post-detail-body" id="postBody"></p>
      <div class="post-visual" id="postVisual" hidden></div>
      <a class="inline-link" id="postRelatedLink" hidden></a>
    </article>
  </main>
  <div id="site-footer"></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
